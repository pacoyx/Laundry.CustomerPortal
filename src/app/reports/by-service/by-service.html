<div class="tab-content">
  @if (loading()) {
    <div class="table-loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <div class="portal-card chart-card">
      <canvas baseChart [data]="amountData()" [options]="chartOptions" type="doughnut"></canvas>
    </div>

    <div class="portal-card table-card" style="margin-top: 20px;">
      <table class="w-100 by-service-table">
        <thead>
          <tr>
            <th>Servicio</th>
            <th>Cantidad</th>
            <th>Peso (kg)</th>
            <th>Importe</th>
          </tr>
        </thead>
        <tbody>
          @for (item of items(); track item.serviceName) {
            <tr>
              <td>{{ item.serviceName }}</td>
              <td>{{ item.quantity | number }}</td>
              <td>{{ item.weight | number: '1.0-1' }}</td>
              <td>{{ item.amount | currency: 'PEN' : 'S/' }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
