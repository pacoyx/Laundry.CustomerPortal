<div class="auth-page">
  <div class="auth-panel">
    <div class="auth-brand">
      <mat-icon class="auth-brand-icon">local_laundry_service</mat-icon>
      <h1>Laundry</h1>
      <p>Portal Empresarial de Clientes</p>
    </div>

    <mat-card class="auth-card">
      <mat-card-content>
        <h2>Iniciar sesión</h2>
        <p class="auth-subtitle">Ingresa tus credenciales para acceder al portal</p>

        <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Usuario</mat-label>
            <input matInput formControlName="username" autocomplete="username" />
            <mat-icon matSuffix>person</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Contraseña</mat-label>
            <input
              matInput
              [type]="hidePassword() ? 'password' : 'text'"
              formControlName="password"
              autocomplete="current-password"
            />
            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="hidePassword.set(!hidePassword())"
            >
              <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          @if (errorMessage()) {
            <div class="auth-error">{{ errorMessage() }}</div>
          }

          <button
            mat-flat-button
            color="primary"
            class="auth-submit"
            type="submit"
            [disabled]="loading()"
          >
            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Iniciar Sesión
            }
          </button>

          <a routerLink="/forgot-password" class="auth-link">Olvidé mi contraseña</a>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
