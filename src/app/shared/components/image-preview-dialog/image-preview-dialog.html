<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content class="image-preview-content">
  <img [src]="data.imageUrl" [alt]="data.title" class="image-preview-img" />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="download()">
    <mat-icon>download</mat-icon>
    Descargar
  </button>
  <button mat-flat-button color="primary" mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
