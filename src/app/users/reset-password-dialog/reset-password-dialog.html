<h2 mat-dialog-title>Resetear contraseña</h2>
<mat-dialog-content>
  <p>
    ¿Confirmas resetear la contraseña de <strong>{{ data.fullName }}</strong> ({{ data.email }})? Se generará una
    nueva contraseña y se enviará automáticamente a su correo. Su sesión actual se cerrará.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" [mat-dialog-close]="true">Confirmar reseteo</button>
</mat-dialog-actions>
