<mat-toolbar class="portal-header">
  <span class="portal-header-company">{{ profile()?.customerName }}</span>

  <span class="portal-header-spacer"></span>

  <button mat-button [matMenuTriggerFor]="userMenu" class="portal-header-user">
    <mat-icon>account_circle</mat-icon>
    <span class="portal-header-user-name">{{ profile()?.fullName }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="portal-header-menu-info">
      <strong>{{ profile()?.fullName }}</strong>
      <small>{{ profile()?.role }}</small>
    </div>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>
